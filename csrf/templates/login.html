<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Apple ID Account Portal</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="apple-nav">
        <div class="nav-brand">Account ID</div>
        <span class="nav-badge">Security Portal</span>
    </nav>

    <main class="container-narrow">
        <div class="hero">
            <p class="eyebrow">Directory Services</p>
            <h1>Sign in to Account</h1>
            <p class="subtitle">Manage your corporate email and security settings.</p>
        </div>

        <div class="card">
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="admin" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-full">Continue</button>
            </form>

            <div style="text-align: center;">
                <span class="hint-pill">Demo credentials: <strong>admin</strong> / <strong>password123</strong></span>
            </div>
        </div>
    </main>
</body>
</html>
